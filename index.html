<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#170F3B" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Headquarters — a game inside Riley's mind</title>
    <style>
      html, body { margin: 0; background: #0c0726; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #3a2780, #0c0726 70%); color: #f3eeff; font: 700 18px system-ui, sans-serif; z-index: 10; transition: opacity 0.5s ease; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .orbs { display: flex; gap: 14px; justify-content: center; margin-bottom: 18px; }
      #boot .orbs span { width: 22px; height: 22px; border-radius: 50%; animation: bob 1.2s ease-in-out infinite; box-shadow: 0 0 16px currentColor; background: currentColor; }
      #boot .orbs span:nth-child(1) { color: #ffcf33; }
      #boot .orbs span:nth-child(2) { color: #3d7bff; animation-delay: 0.12s; }
      #boot .orbs span:nth-child(3) { color: #f0412d; animation-delay: 0.24s; }
      #boot .orbs span:nth-child(4) { color: #a05cf0; animation-delay: 0.36s; }
      #boot .orbs span:nth-child(5) { color: #52c46b; animation-delay: 0.48s; }
      @keyframes bob { 50% { transform: translateY(-12px); } }
      @media (prefers-reduced-motion: reduce) { #boot .orbs span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite"><div><div class="orbs" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>Waking up Riley’s mind…</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
